## =========================================================================================
#  Coupler configuration options
## =========================================================================================

# The version of the coupler that is used. Since we are using the super-repo, which
# has the correct version checked out, use "HEAD".
cancpl_ver=HEAD
cancpl_repo=/home/ords/crd/ccrn/cmr206/finalize_canesm5_19/code/CanESM/CanCPL/

# cpl_rs_abort_if_missing_field = .false. means that the coupler will not abort
# when it encounters a missing field in the coupler restart file.
# The default is to abort in this situation.
# The only valid values for cpl_rs_abort_if_missing_field are .true. or .false.
cpl_rs_abort_if_missing_field=.false.

# Is a bulk formulation used in the coupler to define fields sent to NEMO
bulk_in_cpl=.false.

# Save coupler history files to DATAPATH
save_cplhist=on
save_cplhist_tavg=off

## =========================================================================================
#  NEMO configuration options
## =========================================================================================

# The version of NEMO that is used as well as the location of the NEMO repository
# We are using the super-repo, which has the correct version of CanNEMO checked out. So use "HEAD"
nemo_ver=HEAD
nemo_repo=/home/ords/crd/ccrn/cpd103/mtest-027/code/CanESM/CanNEMO/

# nemo_config identifies a particular configuration (e.g. CCC_CANCPL_ORCA1_LIM_CMOC)
nemo_config=CCC_CANCPL_ORCA1_LIM_CMOC   # NEMO ORCA1 physical ocean with LIM2 ice

# The name of the nemo executable to use (this must be saved on DATAPATH)
nemo_exec=mc_finalize_canesm5_19_nemo.exe

# Runoff is not read from a file in NEMO
nemo_ln_rnf_emp=.true.
nemo_ln_rnf=.true.
nemo_runoff_core_monthly=nemo_3.4_orca1_rout_socoeff_month_r1i1p1_1979-2005-mean.nc

# total number of NEMO tiles
nemo_jpnij=144

# nemo_from_rest is used to flag starting nemo from rest rather than a restart
# If nemo_from_rest = off then nemo_restart must be undefined
# If nemo_from_rest = on then nemo_namelist and nemo_namelist_ice must be defined
nemo_from_rest=off

# The name of the nemo restart tarball
# nemo_restart='mc_oda-o1c-cv2_07491231_restart.tar'

# If nemo_rebuild_rsin = on then the NEMO restart will be
# used to initialize fields that are sent from the coupler to the agcm on the first
# coupling interval. This restart will be rebuilt on the global ORCA grid prior to model
# execution and then read by the coupler to extract the relevant fields.
nemo_rebuild_rsin=off

# Save NEMO history files to DATAPATH
nemo_save_hist=on

# NEMO time step in seconds
nemo_rn_rdt=3600

# remove (nemo_nn_closea = 0) or keep (nemo_nn_closea = 1) closed seas and lakes (ORCA)
nemo_nn_closea=1

# The number of NEMO time steps between calls to sbc and LIM2 (or CICE)
nemo_nn_fsbc=1

# nemo_nn_ice identifies the ice model
#   nemo_nn_ice = 0 mean no sea ice
#   nemo_nn_ice = 2 mean LIM2
#   nemo_nn_ice = 4 mean CICE
nemo_nn_ice=2

# nemo_ln_ctl toggles printing of diagnostic messages from NEMO
# nemo_ln_ctl must be either .false. or .true. (ie a fortran logical constant)
# since it is read from a fortran namelist
nemo_ln_ctl=.true.

# nemo_nn_msh  determines if NEMO will create (=1) a mesh file or not (=0)
nemo_nn_msh=1

# CMIP6 post-processing switch
nemo_ar6_diag=1

# Save NEMO timeseries or not
nemo_timeseries=1

# To use CFCs=1 or not =0 (also updated below)
nemo_cfc=1

if [ "${nemo_ar6_diag}" = "1" ] ; then
    # Reset nemo nemelist parameters for on-the-fly diagnostics
    nemo_ln_diaptr=.true.
    nemo_ln_diaznl=.false.
    nemo_ln_subbas=.true.
    nemo_ln_ptrcomp=.true.
    nemo_nn_fwri=24

    # Nemo hist file suffixes and freqs for rebuilding from tiles
    nemo_rbld_hist_file_suffix_list="grid_T grid_U grid_V grid_W icemod ptrc_T diad_T grid_T_ar6 grid_U_ar6 grid_V_ar6 grid_W_ar6 grid_T_ar6 grid_U_ar6 grid_V_ar6 icemod diaptr grid_T_ar6 icemod grid_T_ar6"
    nemo_rbld_hist_file_freq_list="1m 1m 1m 1m 1m 1m 1m 1m 1m 1m 1m 1d 1d 1d 1d 1d 1y 1h 3h"
    canesm_nemo_rbld_save_hist=1
    canesm_nemo_rbld1st_save_hist=0

    # Nemo hist file suffixes and freqs for saving out of the model in nemo_postlude
    nemo_hist_file_suffix_list_save="$nemo_rbld_hist_file_suffix_list scalar_ar6"
    nemo_hist_file_freq_list_save="$nemo_rbld_hist_file_freq_list 1m"
fi

# Additional cpp keys can be added or removed here (note that some runmodes may automatically add their own)
nemo_add_cpp_keys=''
nemo_del_cpp_keys=''

if [ "$nemo_cfc" = "on" ]; then
   #nemo_add_cpp_keys+="key_cfc"
   # The historical runs should all be the "true" date within the historical period
   offset_cfc_year=0
fi

# Because of the way that the canesm.cfg is parsaed in the make_job script, all variables if they're actually
# going to be used have to have the form var=var. So for nemo_add_cpp_keys, we need to restore it to this value
nemo_add_cpp_keys=$nemo_add_cpp_keys

# Set options found in namelist_pisces (ocean BGC) 
[ -z "$ln_c14int" ] && ln_c14int=.false.
