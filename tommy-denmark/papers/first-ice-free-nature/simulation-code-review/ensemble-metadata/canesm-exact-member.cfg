## =========================================================================================
## Core model run options....more below
## =========================================================================================
runid=runid
months=12 # number of months to run in a single job submission
#months_run=1 # number of months to run in a single execution: =1 execute for each month
#months_run=6 # number of months to run in a single execution: =6 execute every 6 months
months_run=$months # number of months to run in single execution: =$months execute once for all months

months_inv=$months # saving frequency for time-invariant files (executables, etc.)

# Start and stop dates: YYYY[:m]
start_time=5001
stop_time=5100

start_rtdiag=5001 # set this to the first year of the simulation !!!

gcmtime=10800 # Model run time in secs

debug=off  # =on means keep the temporary execution directory after the program finishes
noprint=on # =on means not to save any output in ~/.queue/

# model base file (located in CanESM/CCCma_tools/cccjob_dir/lib/jobdefs/canesm_cgcm_jobdef)
model_basefile=canesm_cgcm

# Run mode (forcings & cppdefs)
# Choose from:
# NEMO-AGCM-pi | NEMO-AGCM-pi-relaxed-co2 | NEMO-AGCM-pi-free-co2|
# NEMO-AGCM-hist | NEMO-AGCM-hist-relaxed-co2 | NEMO-AGCM-hist-free-co2 |
# NEMO-AGCM-2xCO2 | NEMO-AGCM-4xCO2 | NEMO-AGCM-8xCO2 | NEMO-AGCM-1ppy | 
# NEMO-AGCM-hist-nudging | NEMO-AGCM-hist_CMIP5 |
# NEMO-AGCM-hist-GHG | NEMO-AGCM-hist-AER | NEMO-AGCM-hist-NAT |                                                 <== Tier 1 D&A 1850-2014 specified CO2
# NEMO-AGCM-hist-GHG-ext | NEMO-AGCM-hist-AER-ext | NEMO-AGCM-hist-NAT-ext |                                     <== Tier 1 D&A 2015-2020 specified CO2
# NEMO-AGCM-hist-stratO3 | NEMO-AGCM-ssp245-stratO3 | NEMO-AGCM-ssp245-GHG |                                     <== Tier 2 D&A specified CO2
# NEMO-AGCM-hist-SOL | NEMO-AGCM-hist-VOL | NEMO-AGCM-hist-VOL-ext | NEMO-AGCM-hist-CO2 | NEMO-AGCM-hist-CO2-ext|<== Tier 3 D&A specified CO2
# NEMO-AGCM-ssp245-AER | NEMO-AGCM-ssp245-NAT |                                                                  <== Tier 3 D&A specified CO2
# NEMO-AGCM-hist-GHG-relaxed-co2 | NEMO-AGCM-hist-AER-relaxed-co2 | NEMO-AGCM-hist-NAT-relaxed-co2 |             <== Tier 1 D&A 1850-2014 relaxed CO2
# NEMO-AGCM-hist-GHG-ext-relaxed-co2 | NEMO-AGCM-hist-AER-ext-relaxed-co2 | NEMO-AGCM-hist-NAT-ext-relaxed-co2 | <== Tier 1 D&A 2015-2020 relaxed CO2
# NEMO-AGCM-ssp245-GHG-relaxed-co2 |                                                                             <== Tier 2 D&A relaxed CO2
# NEMO-AGCM-hist-LU | misc D&A
# NEMO-AGCM-ssp585 | NEMO-AGCM-ssp370 | NEMO-AGCM-ssp245 | NEMO-AGCM-ssp126 |    <== Tier 1 SSPs
# NEMO-AGCM-ssp460 | NEMO-AGCM-ssp434 | NEMO-AGCM-ssp534-os | NEMO-AGCM-ssp119 | <== Tier 2 SSPs
# NEMO-AGCM-ssp585-ext | NEMO-AGCM-ssp126-ext | NEMO-AGCM-ssp534-os-ext |        <== Extensions
# NEMO-AGCM-ssp585-free-co2

runmode=NEMO-AGCM-pi

# production status (set to 0 for development runs)
production=1

## =========================================================================================
#  Core diagnostic job options...more below
## =========================================================================================

# diag base file (located in CanESM/CCCma_tools/cccjob_dir/lib/jobdefs/canesm_diag_jobdef)
diag_basefile=canesm_diag

# with_rtd = 1 means include creation of AGCM run-time diagnostic
# with_rtd = 0 means do not include AGCM run-time diagnostic
with_rtd=1
rtd_xtrachem=on # =on to save some extra chemistry rtds
rtd_ssvars=off # =on to save rtd stats from ss files.

# with_diag = 1 means include creation of AGCM diagnostic
# with_diag = 0 means do not include AGCM diagnostic
with_diag=1

# with_gethist = 1 means get history files from backend
# with_gethist = 0 means do not get history files
with_gethist=1

# with_delhistBE = 1 means delete history files from backend
# with_delhistBE = 0 means do not delete history files from backend
with_delhistBE=1

# with_gcmpak = 1 means repack history files
# with_gcmpak = 0 means do not repack history files
with_gcmpak=1

# with_rtd_cpl = 1 means include creation of Coupler RTD
# with_rtd_cpl = 0 means do not include Coupler RTD
with_rtd_cpl=0
coupler_rtd_exe=cpl_rtd_v-473b09dc-parallel_ppp.exe

# with_rbld_nemo = 1 means to rebuild the nemo tiles
# with_rbld_nemo = 0 means do not rebuild the nemo tiles
with_rbld_nemo=1

# with_rtd_nemo = 1 means include creation of NEMO RTD
# with_rtd_nemo = 0 means do not include NEMO RTD
with_rtd_nemo=1
nemo_physical_rtd_exe=uncs_nemo_physical_rtd_ppp_flxtst2.exe
nemo_ice_rtd_exe=uncs_nemo_ice_rtd_ppp_flxtst2.exe
nemo_carbon_rtd_exe=nemo_carbon-cmoc_rtd_v03c_ppp.exe

# with_time_series = 1 means include creation of time series files
# with_time_series = 0 means do not include time series
with_time_series=1
diag2ts_prefix_list='"dc:mc"'
diag2ts_suffix_list='"gp tp dd dp 6h:3h"'

# with_dump_hist = 1 means dump files specified in canesm_dump_hist_suffix_list to tape
# with_dump_hist = 0 means no dumping of history files
with_dump_hist=1
shortermdir_hist=off # =on to dump in short-term archive, =off to dump in long-term archive

# with_delhistFE = 1 means delete history files after AGCM diagnostic on frontend
# with_delhistFE = 0 means do not delete history files on frontend
with_delhistFE=1

# with_dump_diag = 1 means dump files specified in canesm_dump_diag_suffix_list to tape
# with_dump_diag = 0 means no dumping diagnostic files
with_dump_diag=1
shortermdir_diag=off # =on to dump in short-term archive, =off to dump in long-term archive

# with_deldiag = 1 means delete AGCM diagnostic files on frontend
# with_deldiag = 0 means do not delete AGCM diagnostic files
with_deldiag=1

#---------------------------
# NemoVal diagnostic options
# (plots will be shown http://wiki.cccma.ec.gc.ca/NemoVal/)

# with_nemoval_diag = 1 means that NemoVal diagnostics will be launched automatically according to the settings below
# with_nemoval_diag = 0 means no NemoVal diags
with_nemoval_diag=1

nemoval_repeat_period=100   # plotting freq(yrs)
nemoval_avg_period=10       # plotting avg period(yrs)
# ex: with a repeat period of 100 and avg of 10 we would see plots for years 91-100, 191-200, 291-300, etc which would
#   launched after every simulation year that is a multiple of 100

# resolution of mask used by NemoVal (must match model)  
nemoval_res=1d

# location of pertinent nemoval files on sitestore (this should generally be unchanged)
nemoval_root='/home/ords/crd/ccrn/scrd104/nemoval'

# absolute path to a custom plot yaml file
nemoval_pltyml="${nemoval_root}/data/model_rtime_files/def_yamls/cpld.yaml"

## =========================================================================================
#  AGCM configuration options
## =========================================================================================

modver=gcm18

keeprs=on  # =on means to save restart files every month
agcm32bit=on  # =on means to run AGCM in 32-bit, =off to run AGCM in 64-bit
parallel_io=on  # =on means to use parallel I/O for AGCM model files. Set #define parallel_io in cppdefs file!
uxxx=mc    # prefix for model files

delt=900 # AGCM time step in secs

## =========================================================================================
#  Diagnostics configuration options
## =========================================================================================

gssave=off     # =on to save subdaily main prognostic gridded variables on eta levels (in gpintstats2.dk)
spsave=off     # =on to save subdaily main prognostic spectral variables on pressure levels (in gpintstats2.dk)
gpxsave=on     # =on to save subdaily traces on pressure levels (in xstats5.dk)
nocleanup=off  # =on to deactivate cleanall.dk and leave all subdaily files saved as ${flabel}_* on disk 

# daily data tiers (default tier is "1")
# 0: exit, i.e., not output daily files
# 1: all 2-D variables requested for CMIP6, saved in _dd file
# 2: all 3-D variables on pressure levels, saved in _dp file
daily_cmip6_tiers='"1 2"'

## =========================================================================================
#  Model run configuration options
## =========================================================================================

if [ "$agcm32bit" = "on" ] ; then
  float1=on
  precision="32bit"
else
  float1=off
  precision="64bit"
fi

# AGCM nudging switch
relax=off # =on to activate AGCM nudging

# CPP defs controlling model output
cppdefs_diag=$CCRNSRC/CanESM/CONFIG/ESM/cppdefs/cppdefs_diag_default

