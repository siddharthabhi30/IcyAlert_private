# Transfer options

# This is a white space separated list of file suffixes which will be transferred from the
# backend to the frontend, at the end of each year. The syntax '+months_rs' or
# '+months_gs', indicates the frequency at which the files are produced / which files
# are moved. This depends on 'months', and these variables will be replaced with the
# correct values in the job string.
xc2ppp_suffix_list="gcm+months_gs inv+months_gs 3hr+months_gs par+months_rs rs_nmf+months_rs phys_parm+months_ab an+months_ab ab+months_ab \
 otm+months_gs ts_nmf+months_rs \
 cplhist.nc+months_gs cplrs+months_rs cpl.exe+months_ab \
 env+months_ab jobstring+months_ab \
 1m_grid_t+months_gs 1m_grid_u+months_gs 1m_grid_v+months_gs 1m_grid_w+months_gs 1m_icemod+months_gs 1m_ptrc_t+months_gs 1m_diad_t+months_gs mesh_mask+months_gs nemors+months_rs \
 1m_grid_t_ar6+months_gs 1m_grid_u_ar6+months_gs 1m_grid_v_ar6+months_gs 1m_grid_w_ar6+months_gs 1m_scalar_ar6.nc+months_gs 1d_grid_t_ar6+months_gs \
 1d_grid_u_ar6+months_gs 1d_grid_v_ar6+months_gs 1d_icemod+months_gs 1d_diaptr+months_gs 1y_grid_t_ar6+months_gs 1h_icemod+months_gs 3h_grid_t_ar6+months_gs"

xc2ppp_delete_files=off # xc2ppp_delete_files indicates whether to delete files from xc40 (lustre) after transfer (on) or not (off)
xc2ppp_keep_file_list=off # xc2ppp_keep_file_list indicates whether to keep (=on) or remove (=off) the list of files to be transferred in ~/.queue directory. The default is =on.

# list of files to transfer before the very 1st year of the run (initial restart files, etc.)
xc2ppp1st_suffix_list="rs_nmf+months_rs phys_parm+months_ab an+months_ab ab+months_ab \
 ts_nmf+months_rs \
 cplrs+months_rs cpl.exe+months_ab \
 nemors+months_rs"
xc2ppp1st_delete_files=off # xc2ppp1st_delete_files indicates whether to delete files from xc40 (lustre) after transfer (on) or not (off)
xc2ppp1st_keep_file_list=off # xc2ppp1st_keep_file_list indicates whether to keep (=on) or remove (=off) the list of files to be transferred in ~/.queue directory. The default is =on.

# Dumping options

# This is a list of model history files which will get dumped from sitestore to tape using hpcarchive. Files must exist.
canesm_dump_hist_suffix_list="gs ss 3h rs_nmf+months_rs phys_parm+months_ab an+months_ab ab+months_ab \
 tm ts_nmf+months_rs \
 cplhist.nc+months_gs cplrs+months_rs cpl.exe+months_ab \
 env+months_ab jobstring+months_ab \
 1m_grid_t.nc+months_gs 1m_grid_u.nc+months_gs 1m_grid_v.nc+months_gs 1m_grid_w.nc+months_gs 1m_icemod.nc+months_gs 1m_ptrc_t.nc+months_gs 1m_diad_t.nc+months_gs mesh_mask.nc+months_gs nemors.tar+months_rs \
 1m_grid_t_ar6.nc+months_gs 1m_grid_u_ar6.nc+months_gs 1m_grid_v_ar6.nc+months_gs 1m_grid_w_ar6.nc+months_gs 1m_scalar_ar6.nc+months_gs 1d_grid_t_ar6.nc+months_gs \
 1d_grid_u_ar6.nc+months_gs 1d_grid_v_ar6.nc+months_gs 1d_icemod.nc+months_gs 1m_diaptr.nc+months_gs 1y_grid_t_ar6.nc+months_gs 1h_icemod.nc+months_gs 3h_grid_t_ar6.nc+months_gs"

# This is a list of model history files which will get dumped from sitestore to tape using hpcarchive before the very 1st year.
canesm_dump_hist1st_suffix_list="rs_nmf+months_rs phys_parm+months_ab an+months_ab ab+months_ab \
 ts_nmf+months_rs \
 cplrs+months_rs cpl.exe+months_ab \
 nemors.tar+months_rs"

# This is a list of diagnostic files which will get dumped from sitestore to tape using hpcarchive. Files must exist.
canesm_dump_diag_suffix_list="gp xp tp dd dp 6h"

# Delete options

# mdeleteBE_suffix_list indicates the model file suffixes to remove on backend after transfer is done
mdeleteBE_suffix_list="gcm inv 3hr par rs rs_nmf phys_parm an ab \
 otm ts ts_nmf \
 cplhist.nc cplrs cplrs.tar cpl.exe \
 env jobstring \
 1m_grid_t 1m_grid_u 1m_grid_v 1m_grid_w 1m_icemod 1m_ptrc_t 1m_diad_t mesh_mask nemors nemors.tar \
 1m_grid_t_ar6 1m_grid_u_ar6 1m_grid_v_ar6 1m_grid_w_ar6 1m_scalar_ar6.nc 1d_grid_t_ar6 1d_grid_u_ar6 1d_grid_v_ar6 1d_icemod 1d_diaptr 1y_grid_t_ar6 1h_icemod 3h_grid_t_ar6"
mdeleteBE_bexfer=on # =off to delete files on frontend, =on to delete files on backend
mdeleteBE_leave_last_mon=on # =off to delete full year, =on to leave last month from previous year

# mdeleteFE_suffix_list indicates model file suffixes to remove on frontend after diagnostics are done
mdeleteFE_suffix_list="gs ss 3h rs rs_nmf phys_parm an ab \
 tm ts ts_nmf \
 cplhist.nc cplrs cplrs.tar cpl.exe \
 env jobstring \
 1m_grid_t.nc 1m_grid_u.nc 1m_grid_v.nc 1m_grid_w.nc 1m_icemod.nc 1m_ptrc_t.nc 1m_diad_t.nc mesh_mask.nc nemors.tar \
 1m_grid_t_ar6.nc 1m_grid_u_ar6.nc 1m_grid_v_ar6.nc 1m_grid_w_ar6.nc 1m_scalar_ar6.nc 1d_grid_t_ar6.nc 1d_grid_u_ar6.nc 1d_grid_v_ar6.nc 1d_icemod.nc 1m_diaptr.nc 1d_diaptr.nc \
 1y_grid_t_ar6.nc 1h_icemod.nc 3h_grid_t_ar6.nc"
mdeleteFE_bexfer=off # =off to delete files on frontend, =on to delete files on backend
mdeleteFE_leave_last_mon=on # =off to delete full year, =on to leave last month from previous year

# mdeleteDIAG_suffix_list indicates diagnostic file suffixes to remove on frontend after diagnostics are done
mdeleteDIAG_suffix_list="gp xp tp dd dp 6h"
mdeleteDIAG_prefix_list="dc"
mdeleteDIAG_leave_last_mon=off # =off to delete full year, =on to leave last month from previous year
