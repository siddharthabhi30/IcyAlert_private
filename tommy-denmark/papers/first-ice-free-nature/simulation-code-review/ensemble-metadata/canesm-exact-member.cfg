## =========================================================================================
# Coupling options
## =========================================================================================

# couple_serial = .true. means couple in serial mode (the agcm runs then the ocean runs)
# This should never be set unless debugging requires serial mode
# The only valid values for couple_serial are .true. or .false. (default .false.)
couple_serial=.false.

# Coupling frequency. Must be 24-hr for AMIP-like runs
# # 24-hr
# isbeg=`echo  24 $delt | awk '{printf "%d",$1*3600/$2}'` # 1 day (24 hr) coupling frequency
# ksteps=`echo 24 $delt | awk '{printf "%d",$1*3600/$2}'` # 1 day (24 hr) coupling frequency

# 3-hr
isbeg=`echo  3 $delt | awk '{printf "%d",$1*3600/$2}'` # 3 hr coupling frequency
ksteps=`echo 3 $delt | awk '{printf "%d",$1*3600/$2}'` # 3 hr coupling frequency

# # 1-hr
# isbeg=`echo  1 $delt | awk '{printf "%d",$1*3600/$2}'` # 1 hr coupling frequency
# ksteps=`echo 1 $delt | awk '{printf "%d",$1*3600/$2}'` # 1 hr coupling frequency

# derive other frequency indices based on delt
israd=`echo 24 $delt | awk '{printf "%d",$1*3600/$2}'` # accumulated fields
issp=`echo  6 $delt | awk '{printf "%d",$1*3600/$2}'` # spectral fields
isgg=`echo  6 $delt | awk '{printf "%d",$1*3600/$2}'` # gridded progn. fields
istr=`echo 6 $delt | awk '{printf "%d",$1*3600/$2}'` # tracers
icsw=`echo 1 $delt | awk '{printf "%d",$1*3600/$2}'` # S/W rad. computations
iclw=`echo 1 $delt | awk '{printf "%d",$1*3600/$2}'` # L/W rad. computations

